services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    expose:
      - "5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

  auth:
    build:
      context: ./services/auth
    ports:
      - "3001:3001"
    expose:
      - "3001"
    volumes:
      - ./services/auth:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001

  user:
    build:
      context: ./services/user
    ports:
      - "3002:3002"
    expose:
      - "3002"
    volumes:
      - ./services/user:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3002
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - auth
      - user
